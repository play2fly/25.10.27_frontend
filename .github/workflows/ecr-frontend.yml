name: Build and Push Frontend to ECR

on:
  push:
    branches:
      - prod
      - dev
    paths:
      - '**'
      - '!.github/**'
  workflow_dispatch: # 수동 실행 가능
    inputs:
      aws_access_key_id:
        description: 'AWS Access Key ID'
        required: false
        type: string
      aws_secret_access_key:
        description: 'AWS Secret Access Key'
        required: false
        type: string
        secret: true

env:
  AWS_REGION: ap-northeast-2
  AWS_ACCOUNT_ID: 352302000381

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ inputs.aws_access_key_id || secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ inputs.aws_secret_access_key || secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set ECR repository and tags based on branch
        id: set-config
        run: |
          TIMESTAMP_TAG=$(date +%Y%m%d-%H%M%S)z
          if [[ "${{ github.ref }}" == "refs/heads/prod" ]]; then
            echo "ecr_repo=qio-01-prod-frontend" >> $GITHUB_OUTPUT
            echo "tag=$TIMESTAMP_TAG" >> $GITHUB_OUTPUT
            echo "latest_tag=prod-latest" >> $GITHUB_OUTPUT
            echo "build_env=prod" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            echo "ecr_repo=qio-01-dev-frontend" >> $GITHUB_OUTPUT
            echo "tag=$TIMESTAMP_TAG" >> $GITHUB_OUTPUT
            echo "latest_tag=dev-latest" >> $GITHUB_OUTPUT
            echo "build_env=dev" >> $GITHUB_OUTPUT
          else
            echo "ecr_repo=qio-01-prod-frontend" >> $GITHUB_OUTPUT
            echo "tag=$TIMESTAMP_TAG" >> $GITHUB_OUTPUT
            echo "latest_tag=latest" >> $GITHUB_OUTPUT
            echo "build_env=prod" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ steps.set-config.outputs.ecr_repo }}
          IMAGE_TAG: ${{ steps.set-config.outputs.tag }}
          LATEST_TAG: ${{ steps.set-config.outputs.latest_tag }}
          BUILD_ENV: ${{ steps.set-config.outputs.build_env }}
        run: |
          docker build --platform linux/amd64 \
            --build-arg BUILD_ENV=$BUILD_ENV \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$LATEST_TAG \
            .
          
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$LATEST_TAG
          
          # prod 브랜치인 경우 latest 태그도 함께 푸시 (하위 호환성)
          if [[ "$BUILD_ENV" == "prod" ]]; then
            docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$LATEST_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
            docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
            echo "✅ Frontend image pushed: $ECR_REGISTRY/$ECR_REPOSITORY:latest"
          fi
          
          echo "✅ Frontend image pushed: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "✅ Frontend image pushed: $ECR_REGISTRY/$ECR_REPOSITORY:$LATEST_TAG"

      - name: Set ECS service name based on branch
        id: set-ecs-config
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/prod" ]]; then
            echo "ecs_cluster=qio-01-prod-cluster" >> $GITHUB_OUTPUT
            echo "ecs_service=qio-01-prod-frontend-svc" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            echo "ecs_cluster=qio-01-dev-cluster" >> $GITHUB_OUTPUT
            echo "ecs_service=qio-01-dev-frontend-svc" >> $GITHUB_OUTPUT
          else
            echo "ecs_cluster=qio-01-prod-cluster" >> $GITHUB_OUTPUT
            echo "ecs_service=qio-01-prod-frontend-svc" >> $GITHUB_OUTPUT
          fi

      - name: Force ECS service deployment
        run: |
          CLUSTER=${{ steps.set-ecs-config.outputs.ecs_cluster }}
          SERVICE=${{ steps.set-ecs-config.outputs.ecs_service }}
          
          echo "🔄 Forcing new deployment for ECS service: $SERVICE in cluster: $CLUSTER"
          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$SERVICE" \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }} || {
            echo "⚠️  ECS service update failed. Service may not exist yet."
            echo "   This is normal if the service hasn't been created via CDK yet."
          }
          
          echo "✅ ECS service deployment triggered"
          echo "   Monitor deployment: aws ecs describe-services --cluster $CLUSTER --services $SERVICE --region ${{ env.AWS_REGION }}"

